mount_folders:
  common: /etc/database/common
  movies: /etc/database/movies
  upload: /etc/upload
  registry: /etc/registry
  posters: /etc/posters
  grafana: /etc/grafana
  loki: /etc/loki_data

leader_ansible_host: "{{ hostvars[groups['leader'][0]].ansible_host }}"

registry_host: 127.0.0.1:5000

non_build_services:
  - common_database
  - movies_database
  - nginx
  - grafana
  - alertmanager
  - prometheus
  - loki
  - promtail

services:
  - name: api
    repo: git@github.com:ClintEastwood86/km_old_api.git
    image: "{{ registry_host }}/api:latest"
    dest: "/root/api"

  - name: app
    repo: git@github.com:ClintEastwood86/km_old_app.git
    image: "{{ registry_host }}/app:latest"
    dest: "/root/app"

  - name: bot
    repo: https://github.com/ClintEastwood86/km-bot
    image: "{{ registry_host }}/bot:latest"
    dest: "/root/bot"

  - name: common_database
    image: postgres:16

  - name: movies_database
    image: postgres:16
  
  - name: nginx
    image: nginx:latest
  
  - name: grafana
    image: grafana/grafana:latest

  - name: alertmanager
    image: prom/alertmanager:latest

  - name: prometheus
    image: prom/prometheus:latest

  - name: loki
    image: grafana/loki:latest
  
  - name: promtail
    image: grafana/promtail:latest

---
- name: Клонирование репозиториев
  loop: "{{ build_services }}"
  git:
    repo: "{{ item.repo }}"
    dest: "{{ item.dest }}"
    force: true
    version: main

- name: Замена .env файла
  template:
    src: "../../deploy/services/{{ item.name }}/.env.j2"
    dest: "{{ item.dest }}/.env.production"
    mode: "0755"
  loop: "{{ build_services }}"
  when: item.name == 'app'

- name: Сборка сервисов
  loop: "{{ build_services }}"
  community.docker.docker_image:
    name: "{{ item.image }}"
    state: present
    source: build
    push: true
    force_source: true
    force_tag: true
    build:
      path: "{{ item.dest }}"

- name: Удаление склонированных репозиториев
  loop: "{{ build_services }}"
  file:
    state: absent
    path: "{{ item.dest }}"

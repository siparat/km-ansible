groups:
  - name: api-alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Высокая частота ошибок 5xx"
          description: "Частота ошибок 5xx превышает 5% за последние 5 минут"

      - alert: HighLatency
        expr: (histogram_quantile(0.95, sum(rate(http_request_duration_ms_bucket[5m])) by (le)) > 0.8) AND (sum(rate(http_requests_total[5m])) > 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Высокая задержка запросов"
          description: "95% запросов превышает 800ms за последние 5 минут"

  - name: api-health
    rules:
      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "❌ API недоступен"
          description: |
            {% raw %}
              Приложение не отвечает на /healthz
              Instance: {{ $labels.instance }}
            {% endraw %}

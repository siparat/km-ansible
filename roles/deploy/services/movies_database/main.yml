---
- name: "[{{ service.name }}] Выкладка сервиса"
  community.docker.docker_swarm_service:
    name: "{{ service.name }}"
    image: "{{ service.image }}"
    publish:
      - published_port: 8088
        target_port: 5432
    networks:
      - "{{ network_name }}"
    placement:
      constraints:
        - node.labels.database == true
    mounts:
      - type: bind
        target: /var/lib/postgresql/data
        source: "{{ mount_folders.movies }}"
    env:
      POSTGRES_USER: "{{ env.movies_db.user }}"
      POSTGRES_DB: "{{ env.movies_db.database }}"
      POSTGRES_PASSWORD: "{{ env.movies_db.password }}"

---
- name: "[{{ service.name }}] Конфигурация секретов"
  vars:
    data: "{{ lookup('template', '{{ service.name }}/promtail-config.yml.j2') }}"
    name: promtail-config.yml
  include_tasks: ../secret.yml

- name: "[{{ service.name }}] Выкладка сервиса"
  community.docker.docker_swarm_service:
    name: "{{ service.name }}"
    image: "{{ service.image }}"
    mode: global
    networks:
      - "{{ network_name }}"
    secrets:
      - secret_name: promtail-config.yml
        filename: /etc/promtail/config.yml
    mounts:
      - type: bind
        source: /var/lib/docker/containers
        target: /var/lib/docker/containers
        readonly: true
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    user: root
    args:
      - -config.file=/etc/promtail/config.yml
